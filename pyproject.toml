[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lightface-pipeline"
version = "0.1.0"
description = "Low-light full-chain face authentication training pipeline (detection + 5-pt alignment + recognition + temporal liveness)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # torch (>=2.9 ROCm/DTK) is provided by the host compute environment
    "numpy>=1.25.0",
    "pillow>=10.0.0",
    "PyYAML>=6.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
    "peft>=0.10.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.24.0",
    "einops>=0.7.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
include = ["common*", "detector*", "recognizer*", "liveness*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
