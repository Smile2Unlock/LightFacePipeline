seed: 42
model:
  arch: st_fas_lite
  backbone: mobilenetv3_dual
  feat_dim: 192
  clip_len: 8
  num_classes: 5

teacher:
  model_id: datasets/pretrained/dinov2_reg_base
  hf_endpoint: https://hf-mirror.com
  lora_r: 16
  offline_config_only: false
  enable_grad_checkpointing: true

train:
  precision: fp16
  sdpa_backend: flash_attention
  p_normal: 0.30
  p_frozen: 0.20
  num_workers: 4
  weight_decay: 0.01
  run_dir: runs/liveness_st_fas_lite_local

teacher_stage:
  batch_size_clips: 4
  grad_accum: 8
  epochs: 8
  lr: 0.0003
  hf_lr: 0.0001
  samples_per_epoch: 960
  val_max_batches: null

student_stage:
  batch_size_clips: 8
  grad_accum: 2
  epochs: 12
  lr: 0.001
  backbone_lr: 0.0003
  ema_decay: 0.99
  ema_warmup_tau: 40.0
  samples_per_epoch: 1600
  val_max_batches: null

data:
  train_manifest: datasets/manifests/fas_video_clips_train.jsonl
  val_manifest: datasets/manifests/fas_video_clips_val.jsonl
  test_manifest: datasets/manifests/fas_video_clips_test.jsonl
